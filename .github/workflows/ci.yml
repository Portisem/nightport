name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build app and CLI
        run: swift build
      - name: Validate profiles
        run: |
          for f in profiles/*.json; do
            python3 -c "import json,sys; d=json.load(open(sys.argv[1])); assert d['id'] and d['name'], 'id/name'" "$f" || { echo "Invalid: $f"; exit 1; }
          done
      - name: No proprietary files
        run: |
          if git ls-files | grep -iE '(d3dmetal|libd3dshared|cxcompatdb|\.tie$|\.exe$|\.dll$)'; then
            echo "Proprietary or binary Windows files must not be committed"; exit 1
          fi
